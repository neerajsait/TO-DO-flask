{% extends 'base.html' %}
{% block head %}
<title>TASK</title>
{% endblock %}

{% block body %}
<div class="content">
<h1>Update Task Manager</h1>

<div class="form">
<form action="/update/{{task.id}}" method="POST">
    <input type="text" name="content" id="content" placeholder="Enter a new task" required>
    <button type="submit">Add Task</button>
</form>
</div>
</div>
{% endblock %}
